name: Auto PR - Feature para Main

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    name: 🚀 Validar e Abrir PR

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar projeto
        run: mvn clean compile

      - name: Rodar testes
        run: mvn test

      - name: Build da aplicação
        run: mvn package -DskipTests

      - name: Extrair nome da branch
        id: branch
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          FEATURE_NAME="${BRANCH_NAME#feature/}"
          
          echo "name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "feature=$FEATURE_NAME" >> "$GITHUB_OUTPUT"

      - name: Criar Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          FEATURE_NAME: ${{ steps.branch.outputs.feature }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$BRANCH_NAME" \
            --title "✨ Feature: $FEATURE_NAME" \
            --body "## 🎯 Feature: $FEATURE_NAME
          
          ### ✅ Validações Executadas
          - Build: OK
          - Testes: OK
          - Empacotamento Maven: OK
          
          ### 📋 Checklist
          - [ ] Código revisado
          - [ ] Testes adicionados/atualizados
          - [ ] Documentação atualizada
          - [ ] Sem breaking changes
          
          ### 🔗 Relacionado a
          - Branch: $BRANCH_NAME
          - Desenvolvido automaticamente pelo GitHub Actions
          
          ---
          Aberta automaticamente quando ocorre push em feature/*" \
            || {
              echo "Não foi possível criar o PR. Verificando se já existe..."
              gh pr list \
                --repo "$REPOSITORY" \
                --base main \
                --head "$BRANCH_NAME"
            }